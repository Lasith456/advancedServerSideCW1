version: '3.8'

services:
  backend:
    build:
      context: ./server
    container_name: backend_service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./my-project
    container_name: frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend
